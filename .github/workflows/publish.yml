name: Publish ng-avatar-creator

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Tests
        run: npx ng test ng-avatar-creator --watch=false --browsers=ChromeHeadless
        
      - name: Build Library
        run: npx ng build ng-avatar-creator
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-dist
          path: dist/ng-avatar-creator

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: library-dist
          path: dist/ng-avatar-creator
          
      - name: Publish to npm
        working-directory: dist/ng-avatar-creator
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
